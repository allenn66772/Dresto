name:Frontend CI

on:
push:
branches:[main]

pull_requests:
branches:[main]

jobs:
frontend-check:
runs-on:ubuntu-latest

steps:
-name:Checkout repository
uses:actions/checkout@v4

-name:Setup Node.js
uses:actions/setup-node@v4
with:
node-version:22
cache:npm

-name:install dependencies
run:npm ci

-name:Run lint
run:npm run lint

-name:Build frontend
run:npm run build